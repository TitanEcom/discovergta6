name: Publish scheduled blog posts

on:
  schedule:
    # 05:30 UTC = 06:30 in Amsterdam (winter time)
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build blog pages for today
        run: node scripts/blog.js
      - name: Commit and push if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing new to publish."
            exit 0
          fi
          git config user.name "rustbenchcom"
          git config user.email "rustbench.com@gmail.com"
          git add -A
          git commit -m "Publish scheduled blog post"
          git push
